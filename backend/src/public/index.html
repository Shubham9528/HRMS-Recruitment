<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRMS Recruitment API</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0; padding: 0; height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background-color: #FAFAFA; color: #18181B;
      font-family: 'Inter', sans-serif;
    }
    .card {
      background-color: #FFFFFF; padding: 40px; border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); text-align: center;
      border: 1px solid #E4E4E7; max-width: 400px; width: 90%;
    }
    h1 {
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px;
      margin: 0 0 16px 0; color: #2B3A67;
    }
    p { color: #6B7280; font-size: 16px; line-height: 1.5; margin: 0; }
    .status {
      display: inline-block; margin-top: 24px; padding: 6px 14px;
      background-color: #f0fdf4; color: #16A34A; border-radius: 8px;
      font-weight: 500; font-size: 14px; border: 1px solid #bbf7d0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>HRMS BACKEND</h1>
    <p>The recruitment backend services are online and ready to accept requests.</p>
    <div class="status">● System Operational</div>
  </div>
</body>
</html>
